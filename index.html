<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mie Ayam Wonogiri Mas Jon — mie ayam otentik khas Wonogiri. Pesan langsung via WhatsApp, bisa makan di tempat, takeaway, atau delivery.">
  <meta name="theme-color" content="#b91c1c">
  <title>Mie Ayam Wonogiri Mas Jon</title>
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preload" href="assets/menu/mie-ayam-spesial.webp" as="image" fetchpriority="high">
  <link rel="preload" href="assets/img/logo.webp" as="image">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Open Graph: tampilan bagus saat link dibagikan di WA/FB -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mie Ayam Wonogiri Mas Jon">
  <meta property="og:description" content="Rasa otentik khas Wonogiri. Pesan langsung via WhatsApp.">
  <meta property="og:image" content="assets/menu/mie-ayam-spesial.webp">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="wrap site-header__inner">
      <div class="brand">
        <img src="assets/img/logo.webp" alt="Logo Mie Ayam Wonogiri Mas Jon"
             class="brand__logo" width="48" height="48">
        <div>
          <h1 class="brand__name" id="brand-name">Mie Ayam Wonogiri</h1>
          <p class="brand__tag" id="brand-tag">Rasa Otentik</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="admin.html" class="btn btn--ghost" aria-label="Panel admin">
          <span id="admin-icon" aria-hidden="true"></span><span class="label">Admin</span>
        </a>
        <a href="#keranjang" class="btn btn--amber" aria-label="Lihat keranjang">
          <span id="cart-icon" aria-hidden="true"></span>
          <span class="cart-badge" id="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="info-bar" id="info-bar" role="status"></div>

  <main class="wrap">

    <!-- ============ WELCOME ============ -->
    <section class="card card--welcome">
      <h2 class="section-title">Selamat Datang!</h2>
      <p class="welcome-lead" id="welcome-desc"></p>
      <div class="meta-row" id="meta-row"></div>
    </section>

    <!-- ============ MENU ============ -->
    <section aria-labelledby="menu-title">
      <div class="section-title" id="menu-title">
        <span id="menu-icon" aria-hidden="true"></span> Daftar Menu Spesial
      </div>
      <p class="section-sub">Pilih menu favorit Anda, lalu kirim pesanan lewat WhatsApp.</p>

      <div class="filters" id="filters" role="group" aria-label="Filter kategori menu"></div>

      <div class="menu-grid" id="menu-container">
        <noscript>
          <p class="cart-empty">Aktifkan JavaScript untuk melihat daftar menu.</p>
        </noscript>
      </div>
    </section>

    <!-- ============ KERANJANG ============ -->
    <section id="keranjang" class="card card--cart" aria-labelledby="cart-title">
      <h2 class="section-title" id="cart-title"><span id="cart-title-icon" aria-hidden="true"></span> Rekap Pesanan Anda</h2>

      <div id="cart-items"></div>

      <div class="total-row">
        <span>Total Bayar</span>
        <span class="total-row__amount" id="cart-total">Rp 0</span>
      </div>

      <form id="order-form" novalidate>
        <div class="field" id="field-service">
          <label for="service-type">Tipe Pelayanan</label>
          <select id="service-type" name="service">
            <option value="Makan di Tempat">Makan di Tempat</option>
            <option value="Bawa Pulang (Takeaway)">Bawa Pulang (Takeaway)</option>
            <option value="Delivery / Kirim ke Alamat">Delivery / Kirim ke Alamat</option>
          </select>
          <p class="error-text" role="alert"></p>
        </div>

        <div class="field" id="field-customer">
          <label for="customer-info">Nama Pemesan / No. Meja / Alamat</label>
          <input type="text" id="customer-info" name="customer"
                 placeholder="Contoh: Budi — Meja 4" autocomplete="name" maxlength="120">
          <p class="error-text" role="alert"></p>
        </div>

        <div class="field">
          <label for="order-note">Catatan (opsional)</label>
          <input type="text" id="order-note" name="note"
                 placeholder="Contoh: tanpa sawi, pedas, mie sedikit" maxlength="160">
        </div>

        <button type="submit" class="btn btn--green">
          <span id="submit-icon" aria-hidden="true"></span> Kirim Pesanan via WhatsApp
        </button>
        <p class="field__hint">
          Pesanan akan dibuka di WhatsApp. Pastikan nomor WhatsApp aktif.
        </p>
      </form>
    </section>

  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="wrap">
      <h3 class="site-footer__name" id="footer-name"></h3>
      <p class="site-footer__addr" id="footer-addr"></p>
      <div class="social" id="footer-social"></div>
      <p class="copyright">&copy; <span id="year">2026</span> Mie Ayam Wonogiri Mas Jon. Semua hak dilindungi.</p>
    </div>
  </footer>

  <!-- Tombol keranjang mengapung (mobile) -->
  <button type="button" class="fab" id="fab" hidden>
    <span>Lihat Pesanan</span>
    <span class="fab__total" id="fab-total"></span>
  </button>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
