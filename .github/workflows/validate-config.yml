name: Validasi config.json

on:
  push:
    branches: [main]
    paths: ['config.json', 'scripts/validate-config.js']
  pull_request:
    paths: ['config.json', 'scripts/validate-config.js', 'index.html', 'admin.html']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cek struktur config.json
        run: node scripts/validate-config.js
      - name: Cek sintaks JavaScript
        run: |
          for f in assets/js/*.js; do node --check "$f"; done
